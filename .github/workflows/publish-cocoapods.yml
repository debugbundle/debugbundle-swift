name: Publish Swift SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_trunk:
        description: Also publish to writable CocoaPods Trunk (explicit channel only)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate tag matches podspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SPEC_VERSION="$(ruby -ne 'if $_ =~ /s\.version\s*=\s*"([^"]+)"/; puts $1; exit; end' DebugBundle.podspec)"
          if [ "v${SPEC_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match podspec version ${SPEC_VERSION}."
            exit 1
          fi

      - name: Run Swift package tests
        run: make test

      - name: Run iOS simulator tests
        run: make test-ios-simulator

      - name: Compile against the iOS 15 deployment target
        run: make build-ios-15

      - name: Build Swift package
        run: make build

      - name: Run clean SPM delivery smoke
        run: make smoke-spm

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods --no-document
          fi
          pod --version

      - name: Lint podspec
        run: make pod-lint

      - name: Run clean CocoaPods delivery smoke
        run: make smoke-cocoapods

      - name: Resolve immutable Git release
        id: native_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(ruby -ne 'if $_ =~ /s\.version\s*=\s*"([^"]+)"/; puts $1; exit; end' DebugBundle.podspec)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          tag="v$VERSION"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

      - name: Verify public SPM and Git CocoaPods consumers
        run: |
          make smoke-spm-published VERSION="${{ steps.native_version.outputs.version }}"
          make smoke-cocoapods-git VERSION="${{ steps.native_version.outputs.version }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.native_version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --verify-tag --title "Swift $VERSION" --generate-notes
          echo "SPM and Git CocoaPods are qualified. CocoaPods Trunk is a separate, explicitly selected channel." >> "$GITHUB_STEP_SUMMARY"

  trunk:
    name: Explicit CocoaPods Trunk channel
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_trunk }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Publish podspec to Trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -o pipefail
          VERSION="$(ruby -ne 'if $_ =~ /s\.version\s*=\s*"([^"]+)"/; puts $1; exit; end' DebugBundle.podspec)"
          if make pod-publish; then
            exit 0
          fi

          echo "CocoaPods client reported a publish failure; checking the registry before failing the release."
          for attempt in 1 2 3 4 5; do
            if pod trunk info DebugBundle | grep -Eq "^[[:space:]]+- ${VERSION} \\("; then
              echo "CocoaPods ${VERSION} is published despite the client-side failure."
              exit 0
            fi
            echo "Published pod is not visible yet; retry ${attempt}/5."
            sleep 15
          done
          exit 1

      - name: Smoke published CocoaPods artifact
        run: |
          VERSION="$(ruby -ne 'if $_ =~ /s\.version\s*=\s*"([^"]+)"/; puts $1; exit; end' DebugBundle.podspec)"
          for attempt in 1 2 3 4 5; do
            if make smoke-cocoapods-published VERSION="$VERSION"; then
              exit 0
            fi
            echo "Published pod is not consumable yet; retry ${attempt}/5."
            sleep 30
          done
          exit 1
