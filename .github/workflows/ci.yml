name: Swift SDK CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  host-swiftpm:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run Swift package tests
        run: make test

      - name: Build Swift package
        run: make build

      - name: Run clean SPM delivery smoke
        run: make smoke-spm

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods --no-document
          fi

      - name: Run clean CocoaPods delivery smoke
        run: make smoke-cocoapods

  ios-simulator:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run iOS simulator tests
        run: make test-ios-simulator

      - name: Compile against the iOS 15 deployment target
        run: make build-ios-15

  current-apple-platform:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Record current Apple toolchain
        run: xcodebuild -version && swift --version
      - name: Verify Swift package and iOS simulator
        run: make test && make test-ios-simulator && make smoke-spm
