name: Verify Published Swift SDK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published native Git version to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods --no-document
          fi
      - name: Verify published artifact in a clean consumer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node --version
          make smoke-spm-published VERSION="$VERSION"
          make smoke-cocoapods-git VERSION="$VERSION"
